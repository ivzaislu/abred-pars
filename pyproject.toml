[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abred-catalog-pipeline"
version = "0.0.1"
description = "Server-hosted crawler/parser/feed producer for Abred"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
]

[project.scripts]
abred-catalog-pipeline = "abred_catalog_pipeline.cli:main"
abred-parser-server = "abred_catalog_pipeline.server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
