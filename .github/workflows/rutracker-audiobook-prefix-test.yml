name: RuTracker audiobook prefix cleanup test

on:
  push:
    branches:
      - assistant/rutracker-audiobook-prefix

permissions:
  contents: write

jobs:
  test-and-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assistant/rutracker-audiobook-prefix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply parser patch
        run: python tools/apply_rutracker_audiobook_prefix_cleanup.py
      - name: Apply regression tests
        run: python tools/apply_rutracker_audiobook_prefix_tests.py
      - name: Syntax check
        run: python -m py_compile src/abred_catalog_pipeline/rutracker/parser.py tests/test_rutracker_title_cleanup.py
      - name: Install tests
        run: python -m pip install -e '.[test]'
      - name: Run full tests
        run: pytest -q
      - name: Materialize tested changes
        if: success()
        run: |
          rm -rf src/abred_catalog_pipeline.egg-info
          rm -f tools/apply_rutracker_audiobook_prefix_cleanup.py
          rm -f tools/apply_rutracker_audiobook_prefix_tests.py
          rm -f .github/workflows/rutracker-audiobook-prefix-test.yml
          git config user.name "abred-catalog-bot"
          git config user.email "abred-catalog-bot@users.noreply.github.com"
          git add src/abred_catalog_pipeline/rutracker/parser.py tests/test_rutracker_title_cleanup.py tools/apply_rutracker_audiobook_prefix_cleanup.py tools/apply_rutracker_audiobook_prefix_tests.py .github/workflows/rutracker-audiobook-prefix-test.yml
          git diff --cached --check
          git commit -m "fix: clean RuTracker audiobook title prefixes"
          git push origin HEAD:assistant/rutracker-audiobook-prefix
