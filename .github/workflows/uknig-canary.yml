name: Uknig live canary

on:
  pull_request:
    paths:
      - "src/abred_catalog_pipeline/uknig/**"
      - "tests/test_uknig.py"
      - ".github/workflows/uknig-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e '.[test]'
      - name: Uknig tests
        run: pytest -q tests/test_uknig.py
      - name: Crawl current catalog page without persistent state
        run: |
          rm -f /tmp/uknig-state.json
          python -m abred_catalog_pipeline.uknig \
            --state /tmp/uknig-state.json \
            --out artifacts \
            --backfill-pages 0 \
            --delay 0.35 \
            --run-id canary-${{ github.run_id }} \
            | tee uknig-canary-result.json
      - name: Audit feed contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          feeds = list(Path("artifacts").glob("*/feed.json"))
          assert len(feeds) == 1, feeds
          feed = json.loads(feeds[0].read_text(encoding="utf-8"))
          assert feed["source"] == "uknig"
          assert feed["pages"] == [1]
          assert feed["records"], "canary produced no playable full books"
          for record in feed["records"]:
              assert record["chapters"], record["external_id"]
              assert all(ch.get("media_url") for ch in record["chapters"]), record["external_id"]
          assert all(row.get("reason") != "preview_only" for row in feed["records"])
          print(json.dumps(feed["counts"], ensure_ascii=False, indent=2))
          PY
      - name: Upload canary artifact
        uses: actions/upload-artifact@v4
        with:
          name: uknig-canary-${{ github.run_id }}
          path: |
            artifacts/**/feed.json
            artifacts/**/manifest.json
            uknig-canary-result.json
          if-no-files-found: error
          retention-days: 7
