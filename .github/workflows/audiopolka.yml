name: Audiopolka catalog feed

on:
  workflow_dispatch:
  schedule:
    # At :17 UTC on hours 00, 10 and 20.
    - cron: "17 */10 * * *"

permissions:
  contents: write

concurrency:
  group: audiopolka-catalog-feed
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e '.[test]'

      - name: Tests
        run: pytest -q

      - name: Crawl Audiopolka
        shell: bash
        env:
          ABRED_RETRY_CLEAN_PATHS: artifacts
        run: |
          set -o pipefail
          bash tools/run-with-transient-retry.sh \
            python -m abred_catalog_pipeline run-audiopolka \
              --state state/audiopolka.json \
              --out artifacts \
              --backfill-pages 50 \
            | tee crawl-result.json

      - name: Audit feed contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          feeds = list(Path("artifacts").glob("*/feed.json"))
          manifests = list(Path("artifacts").glob("*/manifest.json"))
          assert len(feeds) == 1, feeds
          assert len(manifests) == 1, manifests

          feed = json.loads(feeds[0].read_text(encoding="utf-8"))
          manifest = json.loads(manifests[0].read_text(encoding="utf-8"))
          assert feed["source"] == "audiopolka"
          assert manifest["source"] == "audiopolka"
          assert manifest["feed_id"] == feed["feed_id"]
          assert manifest["run_id"] == feed["run_id"]
          print(json.dumps(feed["counts"], ensure_ascii=False, indent=2))
          PY

      # Publish the feed before advancing cursor state. If crawl, audit or
      # artifact upload fails, the next run safely repeats the same cursor window.
      - name: Upload feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: audiopolka-feed-${{ github.run_id }}
          path: |
            artifacts/**/feed.json
            artifacts/**/manifest.json
            crawl-result.json
          if-no-files-found: error
          retention-days: 14

      - name: Persist cursor
        shell: bash
        run: |
          if git diff --quiet -- state/audiopolka.json; then
            echo "Cursor unchanged"
            exit 0
          fi
          git config user.name "abred-catalog-bot"
          git config user.email "abred-catalog-bot@users.noreply.github.com"
          git add state/audiopolka.json
          git commit -m "catalog: advance Audiopolka cursor"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "State conflict while rebasing Audiopolka cursor; refusing to overwrite remote state"
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another state update; retrying ($attempt/5)"
            sleep $((attempt * 2))
          done

          echo "Failed to persist Audiopolka cursor after 5 attempts"
          exit 1
