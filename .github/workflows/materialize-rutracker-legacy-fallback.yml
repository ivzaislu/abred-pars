name: Materialize RuTracker legacy fallback

on:
  push:
    branches:
      - assistant/rutracker-legacy-fallback-final

permissions:
  contents: write

jobs:
  materialize-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assistant/rutracker-legacy-fallback-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Apply tested guarded patch
        run: python tools/apply_rutracker_legacy_fallback.py
      - name: Normalize generated regression-test newlines
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_rutracker.py')
          text = path.read_text(encoding='utf-8')
          marker = r'\n\ndef test_legacy_mixed_latin_author_label_is_parsed'
          idx = text.find(marker)
          if idx < 0:
              raise SystemExit('generated regression-test marker not found')
          text = text[:idx] + text[idx:].replace(r'\n', '\n')
          path.write_text(text, encoding='utf-8')
          PY
      - run: pytest -q
      - name: Remove temporary materialization workflow
        run: rm .github/workflows/materialize-rutracker-legacy-fallback.yml
      - name: Commit final files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: support legacy RuTracker author and narrator metadata'
          git push origin HEAD:assistant/rutracker-legacy-fallback-final
