name: RuTracker people parser regression

on:
  push:
    branches:
      - agent/rutracker-people-parser

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e '.[test]'
      - name: Test
        run: pytest -q
