name: RuTracker catalog feed

on:
  workflow_dispatch:
    inputs:
      forums:
        description: "Comma-separated forum IDs; blank = all configured audiobook forums"
        required: false
        default: ""
        type: string
      max_topics:
        description: "Manual safety bound; 0 = unlimited. Truncated runs never advance cursors."
        required: false
        default: "0"
        type: string
      advance_cursor:
        description: "Persist RuTracker cursor/metadata state after a complete non-truncated run"
        required: false
        default: true
        type: boolean
      download_torrents:
        description: "Legacy enrichment: fetch .torrent metainfo through the Worker"
        required: false
        default: false
        type: boolean
      torrserver_enrich:
        description: "Enrich every RuTracker info_hash through TorrServer and build chapters"
        required: false
        default: true
        type: boolean
      torrserver_max_new:
        description: "Max unconfirmed hashes to ask TorrServer for in this run; 0 = unlimited"
        required: false
        default: "0"
        type: string
  schedule:
    # Every 2 hours at :47 UTC, staggered after Audiopolka.
    - cron: "47 */2 * * *"

permissions:
  contents: write

concurrency:
  group: rutracker-catalog-feed
  cancel-in-progress: false

env:
  RUTRACKER_WORKER_URL: ${{ vars.RUTRACKER_WORKER_URL }}
  RUTRACKER_WORKER_TOKEN: ${{ secrets.RUTRACKER_WORKER_TOKEN }}
  RUTRACKER_WORKER_TOKEN_HEADER: ${{ vars.RUTRACKER_WORKER_TOKEN_HEADER || 'X-Proxy-Token' }}
  RUTRACKER_WORKER_MODE: ${{ vars.RUTRACKER_WORKER_MODE || 'mirror' }}
  TORRSERVER_URL: ${{ vars.TORRSERVER_URL }}
  TORRSERVER_URL_2: ${{ vars.TORRSERVER_URL_2 }}
  TORRSERVER_USERNAME: ${{ secrets.TORRSERVER_USERNAME }}
  TORRSERVER_PASSWORD: ${{ secrets.TORRSERVER_PASSWORD }}
  TORRSERVER_MAX_NEW: '0'
  TORRSERVER_TIMEOUT_SECONDS: ${{ vars.TORRSERVER_TIMEOUT_SECONDS || '30' }}
  TORRSERVER_POLL_INTERVAL_SECONDS: ${{ vars.TORRSERVER_POLL_INTERVAL_SECONDS || '1' }}
  TORRSERVER_REPLAY_SUCCESSES: '1'

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e '.[test]'

      - name: Tests
        run: pytest -q

      - name: Validate Worker and TorrServer configuration
        shell: bash
        run: |
          test -n "$RUTRACKER_WORKER_URL" || { echo "Missing Actions variable RUTRACKER_WORKER_URL"; exit 1; }
          test -n "$RUTRACKER_WORKER_TOKEN" || { echo "Missing Actions secret RUTRACKER_WORKER_TOKEN"; exit 1; }
          echo "Worker URL configured: $RUTRACKER_WORKER_URL"
          echo "Worker mode: $RUTRACKER_WORKER_MODE"
          echo "Worker token header: $RUTRACKER_WORKER_TOKEN_HEADER"

          use_torrserver=false
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            use_torrserver=true
          elif [[ "${{ inputs.torrserver_enrich }}" == "true" ]]; then
            use_torrserver=true
          fi

          if [[ "$use_torrserver" == "true" ]]; then
            if [[ -z "$TORRSERVER_URL" && -z "$TORRSERVER_URL_2" ]]; then
              echo "Missing Actions variable TORRSERVER_URL/TORRSERVER_URL_2"
              exit 1
            fi
            torrserver_count=0
            [[ -n "$TORRSERVER_URL" ]] && torrserver_count=$((torrserver_count + 1))
            if [[ -n "$TORRSERVER_URL_2" && "$TORRSERVER_URL_2" != "$TORRSERVER_URL" ]]; then
              torrserver_count=$((torrserver_count + 1))
            fi
            echo "TorrServer instances configured: $torrserver_count"
            echo "TorrServer credentials: shared TORRSERVER_USERNAME/TORRSERVER_PASSWORD"
            echo "TorrServer max unconfirmed hashes: $TORRSERVER_MAX_NEW (0 = unlimited)"
            echo "TorrServer timeout: ${TORRSERVER_TIMEOUT_SECONDS}s"
            echo "TorrServer replay successes: $TORRSERVER_REPLAY_SUCCESSES"
          fi

      - name: Crawl RuTracker through Worker
        shell: bash
        run: |
          args=(
            run-rutracker
            --state state/rutracker.json
            --out artifacts
          )

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "${{ inputs.forums }}" ]]; then
              args+=(--forums "${{ inputs.forums }}")
            fi
            args+=(--max-topics "${{ inputs.max_topics }}")

            if [[ "${{ inputs.advance_cursor }}" == "true" ]]; then
              args+=(--advance-cursor)
            fi

            if [[ "${{ inputs.download_torrents }}" == "true" && "${{ inputs.torrserver_enrich }}" == "true" ]]; then
              echo "Choose only one enrichment mode: download_torrents OR torrserver_enrich"
              exit 1
            fi

            if [[ "${{ inputs.download_torrents }}" == "true" ]]; then
              args+=(--download-torrents)
            fi

            if [[ "${{ inputs.torrserver_enrich }}" == "true" ]]; then
              args+=(
                --torrserver-enrich
                --torrserver-max-new "${{ inputs.torrserver_max_new }}"
                --torrserver-replay-successes "$TORRSERVER_REPLAY_SUCCESSES"
              )
            fi
          else
            args+=(
              --advance-cursor
              --torrserver-enrich
              --torrserver-max-new "$TORRSERVER_MAX_NEW"
              --torrserver-replay-successes "$TORRSERVER_REPLAY_SUCCESSES"
            )
          fi

          python -m abred_catalog_pipeline "${args[@]}" | tee crawl-result.json

      # Artifact must exist before cursor/cache state is committed. If upload
      # fails, the next run will safely repeat the same cursor/metadata work.
      - name: Upload feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: rutracker-feed-${{ github.run_id }}
          path: |
            artifacts/**/feed.json
            artifacts/**/manifest.json
            crawl-result.json
          if-no-files-found: error
          retention-days: 14

      - name: Persist cursor and TorrServer metadata state
        if: github.event_name == 'schedule' || inputs.advance_cursor == true
        shell: bash
        run: |
          if git diff --quiet -- state/rutracker.json; then
            echo "Cursor/metadata state unchanged"
            exit 0
          fi
          git config user.name "abred-catalog-bot"
          git config user.email "abred-catalog-bot@users.noreply.github.com"
          git add state/rutracker.json
          git commit -m "catalog: persist RuTracker cursor/metadata state"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "State conflict while rebasing RuTracker state; refusing to overwrite remote state"
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another state update; retrying ($attempt/5)"
            sleep $((attempt * 2))
          done

          echo "Failed to persist RuTracker state after 5 attempts"
          exit 1
